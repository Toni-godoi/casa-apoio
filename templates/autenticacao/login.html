{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Casa de Apoio - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg,
                    #003e4d,
                    #091e64,
                    #004789);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card-login {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 30px;
            padding: 40px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, .15);
        }

        .titulo-login {
            color: #0B5ED7;
            font-weight: 700;
            font-size: 3rem;
        }

        .badge-sistema {
            background: #e9ecef;
            color: #6c757d;
            font-weight: normal;
        }

        .btn-acessar {
            background: #0B5ED7;
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            padding: 12px;
        }

        .btn-acessar:hover {
            background: #0B5ED7;
        }

        .form-control {
            border: none;
            border-bottom: 2px solid #ced4da;
            border-radius: 0;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #18d3c3;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card card-login text-center">
                    <h1 class="titulo-login mb-5">
                        Login
                    </h1>
                    {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-danger">
                        {{ message }}
                    </div>
                    {% endfor %}
                    {% endif %}
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-4">
                            {{ form.credencial }}
                        </div>
                        <div class="mb-4">
                            {{ form.senha }}
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-acessar">
                                Entrar
                            </button>
                        </div>
                    </form>
                    <div class="text-center mt-4">
                        <a href="#" class="text-decoration-none">
                            Esqueceu sua senha?
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
