{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-danger">
        {{ message }}
    </div>
    {% endfor %}
    {% endif %}

    <div class="card shadow border-0">
        <div class="card-body p-4">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h3 class="mb-1">Adicionar acompanhante</h3>
                    <p class="text-muted mb-0">
                        Paciente: <strong>{{ apoio }}</strong>
                    </p>
                </div>
            </div>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-flex gap-2"> <a href="{% url 'apoio:detalhe' apoio.id %}"
                        class="btn btn-outline-secondary"> Cancelar </a> <button type="submit" class="btn btn-primary">
                        Salvar acompanhante </button> </div>
            </form>
        </div>
    </div>
</div>{% endblock %}
