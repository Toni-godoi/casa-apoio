<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Sistema</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            overflow-x: hidden;
        }

        .sidebar {
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #1f2937;
            padding-top: 20px;
        }

        .sidebar a {
            color: #d1d5db;
            display: block;
            padding: 12px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background-color: #374151;
            color: #fff;
        }

        .content {
            margin-left: 250px;
            padding: 30px;
        }
    </style>
</head>

<body>
    <!-- SIDEBAR -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <div class="sidebar">
        <h5 class="text-white text-center mb-4">Casa de Apoio</h5>
        <a href="#">Dashboard</a>
        <a class="d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#menuApoios"
            role="button" aria-expanded="false">
            Apoios
            <span>▾</span>
        </a>
        <div class="collapse" id="menuApoios">
            <a href="{% url 'apoio:listar_apoios' %}" class="ps-4">Ver apoios</a>
        </div>
        <div class="collapse" id="menuApoios">
            <a href="{% url 'apoio:iniciar' %}" class="ps-4">Novo Apoio</a>
        </div>
        <a href="#">Pessoas</a>
        <a class="d-flex justify-content-between align-items-center" data-bs-toggle="collapse" href="#menuApoios"
            role="button" aria-expanded="false">
            Quartos
            <span>▾</span>
        </a>
        <div class="collapse" id="menuApoios">
            <a href="{% url 'quarto:listar_quartos' %}" class="ps-4">Ver quartos</a>
        </div>
        <a href="#">Relatórios</a>
    </div>
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>
</body>

</html>
